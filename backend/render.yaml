services:
  - type: web
    name: meeting-room-booking-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # set this to your Postgres connection string
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      - key: WORK_DAY_START
        value: "09:00"
      - key: WORK_DAY_END
        value: "18:00"
